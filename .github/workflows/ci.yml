name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: matrades
          POSTGRES_PASSWORD: matrades
          POSTGRES_DB: matrades
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matrades" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/generate_contracts.py --check
      - run: uv run alembic -c infra/migrations/alembic.ini upgrade head
      - run: uv run pytest --cov=modules --cov=apps --cov-report=xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  autonomous-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: uv sync --all-extras --dev
      - run: npm ci
      - run: uv run python scripts/generate_contracts.py --check
      - run: uv run pytest tests/contract tests/property tests/replay tests/security tests/unit
      - run: npm run test:contracts
      - run: npm exec tsc --workspace apps/web -- --noEmit

  autonomous-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --all-extras --dev
      - run: uv run pytest tests/integration/test_mt5_execution_bridge.py tests/unit/test_mt5_command_queue.py tests/security/test_execution_command_security.py
