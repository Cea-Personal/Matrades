# ZAP baseline policy. WARN is release-visible; FAIL blocks known high-impact findings.
10010	WARN	Cookie No HttpOnly Flag (session cookies are asserted separately)
10011	WARN	Cookie Without Secure Flag (the scan target is isolated HTTP)
10015	FAIL	Incomplete or No Cache-control Header Set
10016	WARN	Web Browser XSS Protection Not Enabled
10020	FAIL	X-Frame-Options Header Scanner
10021	FAIL	X-Content-Type-Options Header Missing
10038	FAIL	Content Security Policy Header Not Set
10054	FAIL	Cookie without SameSite Attribute
10098	FAIL	Cross-Domain Misconfiguration
10202	WARN	Origin and Fetch Metadata enforcement is verified by the application security suite
