receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: credential
        action: delete
      - key: api_key
        action: delete
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug]}
    logs: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}
