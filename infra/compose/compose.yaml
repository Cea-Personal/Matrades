name: matrades

# Shared backend image used by API, MT5 bridge, worker, and scheduler.
x-backend-image: &backend-image
  image: matrades-backend:local
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/home/postgres/pgdata/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    <<: *backend-image
    environment:
      MATRADES_ENV: ${MATRADES_ENV:-development}
      MATRADES_SECRET_KEY: ${MATRADES_SECRET_KEY}
      MATRADES_AUTH_EMAIL_VERIFICATION_ENABLED: ${MATRADES_AUTH_EMAIL_VERIFICATION_ENABLED:-false}
      MATRADES_OWNER_SETUP_SECRET: ${MATRADES_OWNER_SETUP_SECRET:-}
      MATRADES_AUTH_DEV_TOKENS_ENABLED: ${MATRADES_AUTH_DEV_TOKENS_ENABLED:-false}
      MATRADES_PUBLIC_APP_URL: ${MATRADES_PUBLIC_APP_URL:-}
      MATRADES_SMTP_HOST: ${MATRADES_SMTP_HOST:-}
      MATRADES_SMTP_PORT: ${MATRADES_SMTP_PORT:-587}
      MATRADES_SMTP_USERNAME: ${MATRADES_SMTP_USERNAME:-}
      MATRADES_SMTP_PASSWORD: ${MATRADES_SMTP_PASSWORD:-}
      MATRADES_SMTP_FROM: ${MATRADES_SMTP_FROM:-}
      MATRADES_CORS_ORIGINS: ${MATRADES_CORS_ORIGINS}
      MATRADES_DATABASE_URL: ${MATRADES_DATABASE_URL}
      MATRADES_REDIS_URL: ${MATRADES_REDIS_URL}
      MATRADES_RESEARCH_ARTIFACT_ROOT: ${MATRADES_RESEARCH_ARTIFACT_ROOT:-/app/data/research_cycles}
      MATRADES_RESEARCH_DATA_ROOT: ${MATRADES_RESEARCH_DATA_ROOT:-/app/data/quantitative_research}
      MATRADES_MT5_RUNTIME_CONTROL_URL: ${MATRADES_MT5_RUNTIME_CONTROL_URL:-}
      MATRADES_MT5_RUNTIME_CONTROL_TOKEN: ${MATRADES_MT5_RUNTIME_CONTROL_TOKEN:-}
      MATRADES_MT5_AUTHORITY_TOKEN: ${MATRADES_MT5_AUTHORITY_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - research-artifacts:/app/data/research_cycles
      - research-data:/app/data/quantitative_research
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mt5-bridge:
    <<: *backend-image
    environment:
      MATRADES_MT5_AUTHORITY_URL: ${MATRADES_MT5_AUTHORITY_URL:-}
      MATRADES_MT5_RUNTIME_CONTROL_TOKEN: ${MATRADES_MT5_RUNTIME_CONTROL_TOKEN:-}
      MATRADES_MT5_AUTHORITY_TOKEN: ${MATRADES_MT5_AUTHORITY_TOKEN}
      MATRADES_MT5_COMMAND_QUEUE_PATH: /app/data/mt5-commands/commands.json
    command:
      - uvicorn
      - bridges.mt5.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "10.0.0.3:8765:8765"
    volumes:
      - mt5-command-data:/app/data/mt5-commands
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  worker:
    <<: *backend-image
    command:
      - celery
      - -A
      - apps.worker.app.celery_app:celery_app
      - worker
      - --loglevel=INFO
    environment:
      MATRADES_DATABASE_URL: ${MATRADES_DATABASE_URL}
      MATRADES_REDIS_URL: ${MATRADES_REDIS_URL}
      MATRADES_RESEARCH_ARTIFACT_ROOT: ${MATRADES_RESEARCH_ARTIFACT_ROOT:-/app/data/research_cycles}
      MATRADES_RESEARCH_DATA_ROOT: ${MATRADES_RESEARCH_DATA_ROOT:-/app/data/quantitative_research}
    volumes:
      - research-artifacts:/app/data/research_cycles
      - research-data:/app/data/quantitative_research
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend-image
    command:
      - celery
      - -A
      - apps.worker.app.celery_app:celery_app
      - beat
      - --loglevel=INFO
    environment:
      MATRADES_DATABASE_URL: ${MATRADES_DATABASE_URL}
      MATRADES_REDIS_URL: ${MATRADES_REDIS_URL}
      MATRADES_RESEARCH_ARTIFACT_ROOT: ${MATRADES_RESEARCH_ARTIFACT_ROOT:-/app/data/research_cycles}
      MATRADES_RESEARCH_DATA_ROOT: ${MATRADES_RESEARCH_DATA_ROOT:-/app/data/quantitative_research}
    volumes:
      - research-artifacts:/app/data/research_cycles
      - research-data:/app/data/quantitative_research
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-worker:
    build:
      context: ../..
      dockerfile: apps/agent_worker/Dockerfile
    environment:
      MATRADES_DATABASE_URL: ${MATRADES_DATABASE_URL}
      MATRADES_REDIS_URL: ${MATRADES_REDIS_URL}
      MATRADES_CODEX_ENABLED: ${MATRADES_CODEX_ENABLED:-true}
      MATRADES_RESEARCH_AGENT_TIMEOUT_SECONDS: ${MATRADES_RESEARCH_AGENT_TIMEOUT_SECONDS:-180}
      MATRADES_AGENT_WORKER_CONCURRENCY: ${MATRADES_AGENT_WORKER_CONCURRENCY:-4}
      CODEX_HOME: ${CODEX_HOME:-/root/.codex}
    volumes:
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.vercel
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles:
      - litellm
    command:
      - --port
      - "4000"
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  research-artifacts:
  research-data:
  mt5-command-data:
