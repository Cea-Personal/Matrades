[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "matrades"
version = "0.1.0"
description = "Codex-first, human-controlled multi-market trading decision support"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "celery>=5.4,<6",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<7",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "youtube-transcript-api>=1,<2",
]

[project.optional-dependencies]
analysis = ["numpy>=2,<3", "polars>=1,<2", "scipy>=1.14,<2"]
agents = ["langgraph>=0.2,<1", "litellm>=1.50,<2"]
test = [
  "hypothesis>=6.110,<7",
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
]

[dependency-groups]
dev = ["mypy>=1.14,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "modules", "adapters", "packages", "bridges"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "contract: versioned boundary tests",
  "integration: component integration tests",
  "property: invariant/property tests",
  "replay: deterministic replay tests",
  "security: security boundary tests",
  "failure: safe-failure tests",
  "e2e: end-to-end acceptance tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["packages/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["apps", "modules", "adapters", "packages", "bridges"]
exclude = ["packages/contracts/generated"]
ignore_missing_imports = true
disable_error_code = [
  "attr-defined",
  "no-any-return",
  "no-untyped-def",
  "type-arg",
  "untyped-decorator",
  "var-annotated",
]
