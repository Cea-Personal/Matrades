        summary: { type: string }
        evidence_refs: { type: array, minItems: 1, items: { type: string } }
        lessons: { type: array, items: { type: string } }
    TradeJournal:
      type: object
      required: [trade_id, events, observations, indexing_status]
      properties:
        trade_id: { type: string, format: uuid }
        events: { type: array, items: { $ref: '#/components/schemas/JournalEvent' } }
        observations:
          type: array
          items: { $ref: '#/components/schemas/LiveJournalObservation' }
        terminal_summary: { $ref: '#/components/schemas/PostTradeSummary' }
        indexing_status: { enum: [CURRENT, PENDING, DEGRADED, FAILED] }
        indexed_through_event_id: { type: string, format: uuid }
        indexing_lag_seconds: { type: integer, minimum: 0 }
    KnowledgeAssistantQuery:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        account_id: { type: string, format: uuid }
        trade_id: { type: string, format: uuid }
        source_types: { type: array, items: { type: string } }
        filters: { type: object, additionalProperties: true }
    KnowledgeCitation:
      type: object
      required: [source_id, document_id, segment_id, version, excerpt]
      properties:
        source_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        segment_id: { type: string }
        version: { type: string }
        excerpt: { type: string }
        source_time: { type: string, format: date-time }
        freshness: { enum: [FRESH, STALE, UNKNOWN] }
    KnowledgeClaim:
      type: object
      required: [text, citation_indexes]
      properties:
        text: { type: string }
        citation_indexes:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0 }
    KnowledgeAssistantAnswer:
      type: object
      required: [id, status, answer, claims, citations, retrieval_audit_id, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [ANSWERED, PARTIAL, INSUFFICIENT, DEGRADED, REFUSED] }
        answer: { type: string }
        refusal_reason: { type: string }
        claims: { type: array, items: { $ref: '#/components/schemas/KnowledgeClaim' } }
        citations: { type: array, items: { $ref: '#/components/schemas/KnowledgeCitation' } }
        retrieval_audit_id: { type: string, format: uuid }
        source_health: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    ChartCandle:
      type: object
      required: [time, open, high, low, close]
      properties:
        time: { type: string, format: date-time }
        open: { type: string }
        high: { type: string }
        low: { type: string }
        close: { type: string }
        volume: { type: string }
    ChartOverlay:
      type: object
      required: [id, type, occurred_at, payload]
      properties:
        id: { type: string }
        type: { enum: [PLANNED_ENTRY, STOP_LOSS, TAKE_PROFIT, FILL, MANAGEMENT_ACTION,
          JOURNAL_EVENT, POSITION_UPDATE] }
        occurred_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    ChartContext:
      type: object
      required: [trade_id, venue_instrument_id, timeframe, source_time, freshness,
        candles, overlays, read_only]
      properties:
        trade_id: { type: string, format: uuid }
        venue_instrument_id: { type: string, format: uuid }
        futures_contract_id: { type: [string, 'null'], format: uuid }
        timeframe: { type: string }
        source_time: { type: string, format: date-time }
        freshness: { enum: [FRESH, STALE, UNAVAILABLE] }
        mapping: { type: object, additionalProperties: true }
        candles: { type: array, items: { $ref: '#/components/schemas/ChartCandle' } }
        indicators: { type: object, additionalProperties: true }
        overlays: { type: array, items: { $ref: '#/components/schemas/ChartOverlay' } }
        read_only: { type: boolean, const: true }
    EvidenceClass:
      enum: [BACKTEST, PAPER, LIVE, VALIDATION, PROJECTION]
    PerformanceMetricSet:
      type: object
      required: [evidence_class, sample_size, win_rate, net_profit, gross_profit,
        gross_loss, profit_factor, expectancy, maximum_drawdown, payoff_ratio]
      properties:
        evidence_class: { $ref: '#/components/schemas/EvidenceClass' }
        sample_size: { type: integer, minimum: 0 }
        win_rate: { type: string }
        net_profit: { $ref: '#/components/schemas/Money' }
        gross_profit: { $ref: '#/components/schemas/Money' }
        gross_loss: { $ref: '#/components/schemas/Money' }
        profit_factor: { type: string }
        expectancy: { type: string }
        maximum_drawdown: { type: string }
        payoff_ratio: { type: string }
        return_on_risk: { type: string }
    EdgeAssessment:
      type: object
      required: [status, method, sample_size, value, confidence, inputs_digest]
      properties:
        status: { enum: [POSITIVE, NEGATIVE, INCONCLUSIVE, INSUFFICIENT_SAMPLE] }
        method: { type: string }
        sample_size: { type: integer, minimum: 0 }
        value: { type: string }
        confidence: { type: string }
        inputs_digest: { type: string }
    PerformanceAnalytics:
      type: object
      required: [filters, metric_sets, edge_assessments, generated_at]
      properties:
        filters: { type: object, additionalProperties: true }
        metric_sets:
          type: array
          items: { $ref: '#/components/schemas/PerformanceMetricSet' }
        edge_assessments:
          type: array
          items: { $ref: '#/components/schemas/EdgeAssessment' }
        drill_down_refs: { type: array, items: { type: string } }
        generated_at: { type: string, format: date-time }
    NotificationDelivery:
      type: object
      required: [id, channel, notification_version, state, idempotency_key, attempts]
      properties:
        id: { type: string, format: uuid }
        channel: { enum: [IN_PRODUCT, TELEGRAM, PUSHOVER] }
        notification_version: { type: integer, minimum: 1 }
        state: { enum: [QUEUED, SENDING, DELIVERED, RETRY, FAILED, UNKNOWN_DELIVERY] }
        idempotency_key: { type: string }
        provider_message_id: { type: string }
        attempts:
          type: array
          items:
            type: object
            required: [attempt, requested_at, state]
            properties:
              attempt: { type: integer, minimum: 1 }
              requested_at: { type: string, format: date-time }
              completed_at: { type: [string, 'null'], format: date-time }
              state: { enum: [SENDING, DELIVERED, RETRY, FAILED, UNKNOWN_DELIVERY] }
              safe_error_code: { type: string }
    TradeEntryNotification:
      type: object
      required: [id, account_id, broker_order_id, trade_plan_id, status, version,
        confirmed_broker_event_id, deliveries, updated_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        broker_order_id: { type: string, format: uuid }
        trade_plan_id: { type: string, format: uuid }
        status: { enum: [PENDING_ORDER, PARTIALLY_FILLED, FILLED] }
        side: { enum: [BUY, SELL] }
        cumulative_quantity: { type: string }
        average_fill_price: { type: string }
        stop_loss: { type: [string, 'null'] }
        take_profit: { type: [string, 'null'] }
        confirmed_broker_event_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/NotificationDelivery' }
        updated_at: { type: string, format: date-time }
    AutomationOperations:
      type: object
      required: [platform_kill_switch, accounts, generated_at]
      properties:
        platform_kill_switch: { $ref: '#/components/schemas/KillSwitchState' }
        accounts:
          type: array
          items:
            type: object
            required: [account_id, execution_permissions, kill_switch, plans, commands,
              orders, positions, blocks]
            properties:
              account_id: { type: string, format: uuid }
              execution_permissions: { $ref: '#/components/schemas/ExecutionPermissionProfile' }
              kill_switch: { $ref: '#/components/schemas/KillSwitchState' }
              plans: { type: array, items: { $ref: '#/components/schemas/TradePlan' } }
              commands: { type: array, items: { $ref: '#/components/schemas/ExecutionCommand' } }
              orders: { type: array, items: { $ref: '#/components/schemas/BrokerOrder' } }
              positions: { type: array, items: { $ref: '#/components/schemas/BrokerPosition' } }
              blocks: { type: array, items: { type: object, additionalProperties: true } }
        generated_at: { type: string, format: date-time }
    Job:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { enum: [QUEUED, RUNNING, RETRY_SCHEDULED, SUCCEEDED, FAILED, CANCELLED] }
