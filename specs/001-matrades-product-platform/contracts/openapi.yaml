openapi: 3.1.0
info:
  title: Matrades Application API
  version: 2.0.0
  description: >-
    Contract for authenticated configuration, autonomous research, strategy, risk,
    deterministic execution, reconciliation, monitoring, journal, knowledge, chart,
    notification, and performance workflows. The public API exposes bounded automation
    controls and read models, not an arbitrary broker-command endpoint.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Authentication
  - name: Configuration
  - name: Agents
  - name: Accounts
  - name: Research
  - name: Strategies
  - name: Knowledge
  - name: Trading
  - name: Notifications
  - name: Operations
paths:
  /auth/signup:
    post:
      tags: [Authentication]
      security: []
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          description: Registration accepted; email verification required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSecurityState' }
        default: { $ref: '#/components/responses/Error' }
  /auth/sessions:
    post:
      tags: [Authentication]
      security: []
      operationId: beginSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        '202':
          description: Primary authentication accepted; MFA challenge required
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, expires_at]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Authentication]
      operationId: revokeCurrentSession
      responses:
        '204': { description: Session revoked }
        default: { $ref: '#/components/responses/Error' }
  /auth/email-verifications:
    post:
      tags: [Authentication]
      security: []
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Email verified; MFA enrollment required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSecurityState' }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/enrollments:
    post:
      tags: [Authentication]
      operationId: createMfaEnrollment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Pending enrollment and one-time setup material
          content:
            application/json:
              schema:
                type: object
                required: [enrollment_id, method, setup_uri]
                properties:
                  enrollment_id: { type: string, format: uuid }
                  method: { const: TOTP }
                  setup_uri: { type: string, writeOnly: true }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/challenges:
    post:
      tags: [Authentication]
      operationId: verifyMfaChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, minLength: 6, maxLength: 12, writeOnly: true }
      responses:
        '200':
          description: MFA verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSecurityState' }
        default: { $ref: '#/components/responses/Error' }
  /auth/step-up:
    post:
      tags: [Authentication]
      operationId: verifyStepUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_scope, code]
              properties:
                action_scope: { type: string }
                code: { type: string, writeOnly: true }
      responses:
        '200':
          description: Single-use scoped step-up grant
          content:
            application/json:
              schema:
                type: object
                required: [grant_id, action_scope, expires_at]
                properties:
                  grant_id: { type: string, format: uuid }
                  action_scope: { type: string }
                  expires_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /connections:
    get:
      tags: [Configuration]
      operationId: listConnections
      responses:
        '200':
          description: Authorized connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Configuration]
      operationId: createConnection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionCreate' }
      responses:
        '201':
          description: Connection created; full secret is not returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        default: { $ref: '#/components/responses/Error' }
  /credentials:
    post:
      tags: [Configuration]
      operationId: createCredential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, purpose, secret]
              properties:
                name: { type: string }
                provider: { type: string }
                purpose: { type: string }
                secret: { type: string, writeOnly: true }
      responses:
        '201':
          description: Masked credential reference; plaintext is never returned
          content:
            application/json:
              schema:
                type: object
                required: [id, name, provider, purpose, masked_suffix, status, version]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  provider: { type: string }
                  purpose: { type: string }
                  masked_suffix: { type: string }
                  status: { enum: [UNTESTED, ACTIVE, INVALID, RETIRED] }
                  version: { type: integer }
        default: { $ref: '#/components/responses/Error' }
  /credentials/{credential_id}:
    patch:
      tags: [Configuration]
      operationId: replaceCredential
      parameters:
        - name: credential_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - name: Step-Up-Grant
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string, writeOnly: true }
      responses:
        '200':
          description: Credential rotated; only new masked metadata returned
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /connections/{connection_id}/test:
    post:
      tags: [Configuration]
      operationId: testConnection
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Connection test scheduled or completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthState' }
        default: { $ref: '#/components/responses/Error' }
  /models:
    get:
      tags: [Agents]
      operationId: listModels
      responses:
        '200':
          description: Matrades model catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Model' }
        default: { $ref: '#/components/responses/Error' }
  /model-profiles:
    get:
      tags: [Agents]
      operationId: listModelProfiles
      responses:
        '200':
          description: Reusable model profiles and compatible fallbacks
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Agents]
      operationId: createModelProfileVersion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, runtime_type, primary_model_id, fallback_model_ids, requirements]
              properties:
                name: { type: string }
                runtime_type:
                  enum: [CODEX_APP_SERVER, LITELLM]
                  description: CODEX_APP_SERVER is the default; LITELLM profiles require explicit assignment
                primary_model_id: { type: string, format: uuid }
                fallback_model_ids: { type: array, items: { type: string, format: uuid } }
                parameters: { type: object, additionalProperties: true }
                requirements: { type: array, items: { type: string } }
      responses:
        '201':
          description: Immutable model-profile version
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Error' }
  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      responses:
        '200':
          description: Exact required logical registry and active configuration
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agent_id}/configurations:
    post:
      tags: [Agents]
      operationId: createAgentConfigurationVersion
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentConfigurationInput' }
      responses:
        '201':
          description: New immutable configuration version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfiguration' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /accounts:
    get:
      tags: [Accounts]
      operationId: listTradingAccounts
      responses:
        '200':
          description: Authorized trading accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Accounts]
      operationId: createTradingAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradingAccountInput' }
      responses:
        '201':
          description: Trading account created read-only with all execution actions disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{account_id}/execution-permissions:
    get:
      tags: [Accounts]
      operationId: getExecutionPermissions
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Active version and effective account action permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPermissionProfile' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Accounts]
      operationId: replaceExecutionPermissions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/StepUpGrant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionPermissionInput' }
      responses:
        '200':
          description: New immutable permission version activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPermissionProfile' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{account_id}/kill-switch:
    get:
      tags: [Operations]
      operationId: getAccountKillSwitch
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Durable account kill-switch state and effective platform state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{account_id}/kill-switch/activate:
    post:
      tags: [Operations]
      operationId: activateAccountKillSwitch
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KillSwitchChange' }
      responses:
        '200':
          description: Account kill switch durably activated and safety epoch incremented
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{account_id}/kill-switch/deactivate:
    post:
      tags: [Operations]
      operationId: deactivateAccountKillSwitch
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/StepUpGrant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KillSwitchChange' }
      responses:
        '200':
          description: Account kill switch deactivated after fresh broker/account validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        default: { $ref: '#/components/responses/Error' }
  /automation/kill-switch:
    get:
      tags: [Operations]
      operationId: getPlatformKillSwitch
      responses:
        '200':
          description: Durable platform kill-switch state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        default: { $ref: '#/components/responses/Error' }
  /automation/kill-switch/activate:
    post:
      tags: [Operations]
      operationId: activatePlatformKillSwitch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KillSwitchChange' }
      responses:
        '200':
          description: Platform kill switch durably activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        default: { $ref: '#/components/responses/Error' }
  /automation/kill-switch/deactivate:
    post:
      tags: [Operations]
      operationId: deactivatePlatformKillSwitch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/StepUpGrant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KillSwitchChange' }
      responses:
        '200':
          description: Platform kill switch deactivated after safety validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{account_id}/snapshots/current:
    get:
      tags: [Accounts]
      operationId: getCurrentAccountSnapshot
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Latest consistent authoritative snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSnapshot' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{account_id}/effective-limits:
    get:
      tags: [Accounts]
      operationId: getEffectiveLimits
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Strictest normalized constraints with sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EffectiveConstraint' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{account_id}/research-matrix:
    get:
      tags: [Research]
      operationId: getAccountResearchMatrix
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Active versioned asset-class and instrument-type research matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchMatrix' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Research]
      operationId: replaceAccountResearchMatrix
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResearchMatrixInput' }
      responses:
        '200':
          description: New immutable research-matrix version activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchMatrix' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{account_id}/provider-bindings:
    get:
      tags: [Configuration]
      operationId: listAccountProviderBindings
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Effective capability bindings for the account's research lanes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProviderBinding' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Configuration]
      operationId: createAccountProviderBinding
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderBindingInput' }
      responses:
        '201':
          description: Immutable provider-binding version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderBinding' }
        default: { $ref: '#/components/responses/Error' }
  /instruments:
    get:
      tags: [Research]
      operationId: listInstruments
      parameters:
        - name: asset_class
          in: query
          schema: { $ref: '#/components/schemas/AssetClass' }
        - name: instrument_type
          in: query
          schema: { $ref: '#/components/schemas/InstrumentType' }
        - name: connection_id
          in: query
          schema: { type: string, format: uuid }
        - name: capability
          in: query
          schema: { $ref: '#/components/schemas/MarketDataCapability' }
      responses:
        '200':
          description: Canonical instruments and exact provider or broker listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstrumentDescriptor' }
        default: { $ref: '#/components/responses/Error' }
  /prop-rulesets:
    post:
      tags: [Accounts]
      operationId: createPropRulesetDraft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [program_id, version, source, effective_from, rules]
              properties:
                program_id: { type: string, format: uuid }
                version: { type: string }
                source: { type: object, additionalProperties: true }
                effective_from: { type: string, format: date-time }
                rules: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '201':
          description: Unverified, inactive ruleset draft
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Error' }
  /prop-rulesets/{ruleset_id}/activate:
    post:
      tags: [Accounts]
      operationId: activateVerifiedPropRuleset
      parameters:
        - name: ruleset_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Verified ruleset version activated with historical predecessor retained
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /guardrail-profiles:
    post:
      tags: [Accounts]
      operationId: createGuardrailProfileVersion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope, rules]
              properties:
                name: { type: string }
                scope: { type: object, additionalProperties: true }
                rules: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '201':
          description: Immutable guardrail-profile version
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Error' }
  /risk/evaluations:
    post:
      tags: [Accounts]
      operationId: evaluateCandidateRisk
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiskEvaluationRequest' }
      responses:
        '200':
          description: Deterministic PASS, REDUCE_SIZE, or HARD_BLOCK result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskCapacityResult' }
        default: { $ref: '#/components/responses/Error' }
  /research-runs:
    post:
      tags: [Research]
      operationId: createResearchRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id: { type: string, format: uuid }
                lanes:
                  type: array
                  description: Omit to run every enabled lane in the account's active matrix
                  minItems: 1
                  maxItems: 12
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/ResearchLaneKey' }
      responses:
        '202':
          description: Research run queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchRun' }
        default: { $ref: '#/components/responses/Error' }
  /research-runs/{run_id}:
    get:
      tags: [Research]
      operationId: getResearchRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ranked candidates, evidence, health, and autonomous lane-selection state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchRun' }
        default: { $ref: '#/components/responses/Error' }
  /market-selections/{selection_id}:
    get:
      tags: [Research]
      operationId: getMarketSelection
      parameters:
        - name: selection_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Autonomous selection, invalidation, and fallback lineage for one lane
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketSelection' }
        default: { $ref: '#/components/responses/Error' }
  /strategy-drafts:
    post:
      tags: [Strategies]
      operationId: createStrategyDraft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategyDraftInput' }
      responses:
        '201':
          description: Saveable versioned draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyDraft' }
        default: { $ref: '#/components/responses/Error' }
  /strategies/research-context:
    get:
      tags: [Strategies]
      operationId: getStrategyResearchContext
      responses:
        '200':
          description: Readiness and immutable approved-market basis for grounded strategy research
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyResearchContext' }
        default: { $ref: '#/components/responses/Error' }
  /strategy-drafts/{draft_id}:
    get:
      tags: [Strategies]
      operationId: getStrategyDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Draft, accepted rule revisions, provenance, and completeness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyDraft' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Strategies]
      operationId: updateStrategyDraftByUser
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_changes]
              properties:
                user_changes:
                  type: array
                  items: { $ref: '#/components/schemas/RuleChange' }
      responses:
        '200':
          description: Draft revision with USER provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyDraft' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /strategy-drafts/{draft_id}/assist:
    post:
      tags: [Strategies]
      operationId: requestStrategyAssistance
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  enum: [COMPLETE_MISSING_RULES, FORMALIZE, SUGGEST_IMPROVEMENTS, CHALLENGE,
                    MAKE_TESTABLE, SUGGEST_PARAMETERS, EXPLAIN_WEAKNESSES]
                instruction: { type: string, maxLength: 4000 }
      responses:
        '202':
          description: Assistance execution queued; canonical draft is unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /strategy-suggestions/{suggestion_id}/decisions:
