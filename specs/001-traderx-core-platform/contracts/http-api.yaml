openapi: 3.1.0
info:
  title: TraderX Core Platform API
  version: 1.1.0
  summary: Authenticated UI contract for conservative manual trading decision support
  description: |
    Contract for TraderX V1. The API exposes decision support and read-only broker visibility.
    It deliberately contains no operation for creating, modifying, or closing a real-money order.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Identity
  - name: Command Center
  - name: Accounts and Risk
  - name: Integrations
  - name: Markets
  - name: Research and Strategies
  - name: Validation and Paper
  - name: Opportunities
  - name: Positions and Journal
  - name: Notifications and Jobs
  - name: Audit and Health
paths:
  /auth/bootstrap-status:
    get:
      tags: [Identity]
      operationId: getBootstrapStatus
      security: []
      responses:
        '200':
          description: Whether the one-time first-owner setup remains available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BootstrapStatus'}
  /auth/bootstrap:
    post:
      tags: [Identity]
      operationId: bootstrapInitialOwner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '201':
          description: Initial owner created; TOTP enrollment is required before access
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '409': {$ref: '#/components/responses/Problem'}
  /auth/password-reset:
    post:
      tags: [Identity]
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '202':
          description: Reset request accepted. The response does not disclose whether the email exists.
        '429': {$ref: '#/components/responses/Problem'}
  /auth/password-reset/complete:
    post:
      tags: [Identity]
      operationId: completePasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetCompleteRequest'}
      responses:
        '200':
          description: Password reset completed and an MFA-assured session issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '401': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established or MFA challenge required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/mfa/enroll:
    post:
      tags: [Identity]
      operationId: beginMfaEnrollment
      responses:
        '200':
          description: One-time authenticator enrollment URI for the current password-authenticated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaEnrollment'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/mfa/enroll/verify:
    post:
      tags: [Identity]
      operationId: completeMfaEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaCodeRequest'}
      responses:
        '200':
          description: Authenticator enrollment complete and MFA session issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/mfa/verify:
    post:
      tags: [Identity]
      operationId: verifyMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaCodeRequest'}
      responses:
        '200':
          description: MFA challenge complete and MFA session issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/mfa/recovery:
    post:
      tags: [Identity]
      operationId: recoverMfaWithCode
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaRecoveryCodeRequest'}
      responses:
        '200':
          description: Recovery code accepted; all sessions are revoked and fresh TOTP enrollment is required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '401': {$ref: '#/components/responses/Problem'}
  /users/{user_id}/mfa-reset:
    post:
      tags: [Identity]
      operationId: initiateAssistedMfaReset
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaResetCommand'}
      responses:
        '202':
          description: Audited `OWNER` or `ADMIN` reset initiated; target must enroll a fresh TOTP factor
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      responses:
        '204': {description: Session revoked}
  /auth/sessions:
    get:
      tags: [Identity]
      operationId: listSessions
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Session'}
  /auth/sessions/{session_id}:
    delete:
      tags: [Identity]
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': {description: Session revoked}
        '404': {$ref: '#/components/responses/Problem'}
  /dashboard:
    get:
      tags: [Command Center]
      operationId: getDashboard
      responses:
        '200':
          description: Current account, risk, market, opportunity, alert, and health summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /accounts:
    get:
      tags: [Accounts and Risk]
      operationId: listAccounts
      responses:
        '200':
          description: Accounts visible to the user
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Account'}
    post:
      tags: [Accounts and Risk]
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountCommand'}
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '409': {$ref: '#/components/responses/Problem'}
  /accounts/{account_id}:
    get:
      tags: [Accounts and Risk]
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account and current version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '404': {$ref: '#/components/responses/Problem'}
  /accounts/{account_id}/prop-profile:
    put:
      tags: [Accounts and Risk]
      operationId: replacePropProfile
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HighRiskCommand'}
      responses:
        '200': {$ref: '#/components/responses/VersionedResource'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /accounts/{account_id}/risk-policy:
    put:
      tags: [Accounts and Risk]
      operationId: replaceRiskPolicy
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HighRiskCommand'}
      responses:
        '200': {$ref: '#/components/responses/VersionedResource'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /accounts/{account_id}/risk:
    get:
      tags: [Accounts and Risk]
      operationId: getCurrentRisk
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Current risk snapshot and freshness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskSnapshot'}
  /accounts/{account_id}/event-risk-policy:
    get:
      tags: [Accounts and Risk]
      operationId: getEventRiskPolicy
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Current versioned economic-event risk policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRiskPolicy'}
    put:
      tags: [Accounts and Risk]
      operationId: replaceEventRiskPolicy
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventRiskPolicyCommand'}
      responses:
        '200': {$ref: '#/components/responses/VersionedResource'}
        '412': {$ref: '#/components/responses/Problem'}
  /economic-calendar/events:
    get:
      tags: [Markets]
      operationId: listEconomicCalendarEvents
      responses:
        '200':
          description: Approved official and owner-cited economic events with provenance
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EconomicCalendarEvent'}
  /economic-calendar/coverage:
    get:
      tags: [Markets]
      operationId: getEconomicCalendarCoverage
      responses:
        '200':
          description: Source coverage, health, and freshness for the active-market universe
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /economic-calendar/owner-cited-events:
    post:
      tags: [Markets]
      operationId: createOwnerCitedEconomicEvent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OwnerCitedEconomicEventCommand'}
      responses:
        '201':
          description: Append-only cited event revision created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EconomicCalendarEvent'}
        '422': {$ref: '#/components/responses/Problem'}
  /accounts/{account_id}/circuit-breakers:
    get:
      tags: [Accounts and Risk]
      operationId: listCircuitBreakers
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Circuit breaker history/current state
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CircuitBreaker'}
  /circuit-breakers/{breaker_id}/acknowledge:
    post:
      tags: [Accounts and Risk]
      operationId: acknowledgeCircuitBreaker
      parameters:
        - $ref: '#/components/parameters/BreakerId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HighRiskCommand'}
      responses:
        '200': {$ref: '#/components/responses/VersionedResource'}
        '409': {$ref: '#/components/responses/Problem'}
  /integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      responses:
        '200':
          description: Configured integrations and health
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Integration'}
  /integrations/providers:
    get:
      tags: [Integrations]
      operationId: listReviewedProviderCatalogue
      responses:
        '200':
          description: Reviewed provider/model entries available to the current installation and their capability/licensing metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProviderCatalogueEntry'}
  /integrations/non-broker:
    get:
      tags: [Integrations]
      operationId: listReviewedNonBrokerIntegrations
      responses:
        '200':
          description: Configured market-data and LLM integrations with write-only credential status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Integration'}
    post:
      tags: [Integrations]
      operationId: createReviewedNonBrokerIntegration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NonBrokerIntegrationCommand'}
      responses:
        '201':
          description: Reviewed market-data or LLM integration created; plaintext credentials are not returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Integration'}
        '422': {$ref: '#/components/responses/Problem'}
  /integrations/mt5/enrollments:
    post:
      tags: [Integrations]
      operationId: beginManagedMt5Enrollment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagedMt5EnrollmentCommand'}
      responses:
        '201':
          description: MT5 bridge enrollment created with a one-time setup code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedMt5Enrollment'}
        '422': {$ref: '#/components/responses/Problem'}
  /integrations/{integration_id}/mt5/enrollment:
    post:
      tags: [Integrations]
      operationId: renewManagedMt5Enrollment
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Prior MT5 bridge credential revoked and a new one-time setup code issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedMt5Enrollment'}
  /integrations/{integration_id}:
    delete:
      tags: [Integrations]
      operationId: removeManagedMt5Integration
      description: Revokes the managed MT5 bridge, unbinds any TraderX account, and removes the connection from the active UI while retaining audit evidence.
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Integration removed and all active credentials revoked
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RemovedManagedMt5Integration'
                  - $ref: '#/components/schemas/RemovedIntegration'
        '409': {$ref: '#/components/responses/Problem'}
  /integrations/{integration_id}/test:
    post:
      tags: [Integrations]
      operationId: testIntegration
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
  /integrations/{integration_id}/credentials/rotate:
    post:
      tags: [Integrations]
      operationId: rotateIntegrationCredential
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WriteOnlyCredentialCommand'}
      responses:
        '200':
          description: Credential replaced with a new encrypted write-only version; provider must be requalified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Integration'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
  /integrations/{integration_id}/entitlement:
    put:
      tags: [Integrations]
      operationId: declareProviderEntitlement
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntitlementDeclarationCommand'}
      responses:
        '200':
          description: Hashed entitlement evidence recorded pending provider qualification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Integration'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
  /integrations/{integration_id}/non-broker/state:
    put:
      tags: [Integrations]
      operationId: transitionReviewedNonBrokerIntegration
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationLifecycleCommand'}
      responses:
        '200':
          description: Lifecycle state updated; enable/reconnect remains degraded until qualification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Integration'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
  /integrations/{integration_id}/accounts:
    get:
      tags: [Integrations]
      operationId: listDiscoveredBrokerAccounts
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: Provider accounts discovered by the latest successful, non-stale integration test. Secrets and credentials are never included.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProviderAccountCandidate'}
        '409': {$ref: '#/components/responses/Problem'}
  /instruments:
    get:
      tags: [Markets]
      operationId: listInstruments
      parameters:
        - name: category
          in: query
          schema: {$ref: '#/components/schemas/MarketCategory'}
        - name: status
          in: query
          schema: {type: string, enum: [ACTIVE, INACTIVE, ARCHIVED]}
      responses:
        '200':
          description: Instrument Library results
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Instrument'}
  /markets/instruments/{instrument_id}/mapping:
    put:
      tags: [Markets]
      operationId: approveSpecialistSymbolMapping
      description: Owner and MFA approval of one catalogue-bound specialist symbol for an MT5-supported instrument; an external symbol cannot be reassigned silently.
      parameters:
        - name: instrument_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SymbolMappingCommand'}
      responses:
        '200':
          description: Approved immutable mapping revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SymbolMapping'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
  /markets/research/schedule:
    get:
      tags: [Markets]
      operationId: getMarketResearchSchedule
      responses:
        '200':
          description: Global coordinated market-research schedule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketResearchSchedule'}
    put:
      tags: [Markets]
      operationId: configureMarketResearchSchedule
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarketResearchScheduleCommand'}
      responses:
        '200':
          description: Schedule updated for future occurrences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketResearchSchedule'}
        '409': {$ref: '#/components/responses/Problem'}
  /markets/research/model-configuration:
    get:
      tags: [Markets]
      operationId: getMarketResearchModelConfiguration
      responses:
        '200':
          description: One global LLM selection for all market-research categories
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketResearchModelConfiguration'}
    put:
      tags: [Markets]
      operationId: setMarketResearchModelConfiguration
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarketResearchModelCommand'}
      responses:
        '200':
          description: Global selection updated for runs that have not started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketResearchModelConfiguration'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /markets/research/coordinated:
    get:
      tags: [Markets]
      operationId: listCoordinatedMarketResearch
      parameters:
        - name: account_id
          in: query
          schema: {$ref: '#/components/schemas/Id'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Durable coordinated run history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CoordinatedMarketResearchReport'}
    post:
      tags: [Markets]
      operationId: startCoordinatedMarketResearch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoordinatedMarketResearchCommand'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '409': {$ref: '#/components/responses/Problem'}
  /markets/research/coordinated/{run_id}:
    get:
      tags: [Markets]
      operationId: getCoordinatedMarketResearch
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Three-category deterministic results, source/fallback evidence, and optional advisory analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoordinatedMarketResearchReport'}
  /markets/research/category-runs/{run_id}/llm-analysis/retry:
    post:
      tags: [Markets]
      operationId: retryPinnedMarketResearchAnalysis
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '409': {$ref: '#/components/responses/Problem'}
  /market-research-runs:
    post:
      tags: [Markets]
      operationId: startMarketResearch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarketResearchCommand'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
  /market-research-runs/{run_id}:
    get:
      tags: [Markets]
      operationId: getMarketResearchRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Reproducible eligibility and suitability report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketResearchReport'}
  /active-markets:
    get:
      tags: [Markets]
      operationId: listActiveMarkets
      responses:
        '200':
          description: At most one assignment per category
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items: {$ref: '#/components/schemas/ActiveMarket'}
  /active-markets/{category}:
    put:
      tags: [Markets]
      operationId: approveActiveMarket
      parameters:
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActiveMarketCommand'}
      responses:
        '200': {$ref: '#/components/responses/VersionedResource'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
  /research-jobs:
    post:
      tags: [Research and Strategies]
      operationId: startStrategyResearch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResearchCommand'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
  /strategies:
    get:
      tags: [Research and Strategies]
      operationId: listStrategies
      responses:
        '200':
          description: Strategies visible to user
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Strategy'}
    post:
      tags: [Research and Strategies]
      operationId: createStrategy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StrategyCommand'}
      responses:
        '201':
          description: Strategy with initial immutable draft version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Strategy'}
  /strategies/{strategy_id}/versions:
    post:
      tags: [Research and Strategies]
      operationId: createStrategyVersion
      parameters:
        - $ref: '#/components/parameters/StrategyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StrategyVersionCommand'}
      responses:
        '201': {$ref: '#/components/responses/VersionedResource'}
        '409': {$ref: '#/components/responses/Problem'}
  /backtest-runs:
    post:
      tags: [Validation and Paper]
      operationId: startBacktest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunCommand'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
  /validation-runs:
    post:
      tags: [Validation and Paper]
      operationId: startValidation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunCommand'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
  /paper-runs:
    post:
      tags: [Validation and Paper]
      operationId: startPaperRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunCommand'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
  /strategies/{strategy_id}/versions/{version_id}/approval:
    post:
      tags: [Validation and Paper]
      operationId: decideStrategyApproval
      parameters:
        - $ref: '#/components/parameters/StrategyId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalCommand'}
      responses:
        '200': {$ref: '#/components/responses/VersionedResource'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
  /opportunities:
    get:
      tags: [Opportunities]
      operationId: listOpportunities
      responses:
        '200':
          description: Ranked opportunities; score is distinct from risk decision
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Opportunity'}
  /recommendations/{recommendation_id}:
    get:
      tags: [Opportunities]
      operationId: getRecommendation
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
      responses:
        '200':
          description: Complete recommendation or non-actionable terminal state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recommendation'}
  /positions:
    get:
      tags: [Positions and Journal]
      operationId: listPositions
      responses:
        '200':
          description: Broker and paper positions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Position'}
  /positions/{position_id}/classification:
    put:
      tags: [Positions and Journal]
      operationId: correctPositionClassification
      parameters:
        - $ref: '#/components/parameters/PositionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassificationCommand'}
      responses:
        '200': {$ref: '#/components/responses/VersionedResource'}
  /positions/{position_id}/monitoring:
    get:
      tags: [Positions and Journal]
      operationId: getPositionMonitoring
      parameters:
        - $ref: '#/components/parameters/PositionId'
      responses:
        '200':
          description: Frozen thesis plus append-only monitoring observations
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /journal:
    get:
      tags: [Positions and Journal]
      operationId: listJournalEntries
      responses:
        '200':
          description: Journal records and analytics filters
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JournalEntry'}
  /journal/{entry_id}/annotations:
    post:
      tags: [Positions and Journal]
      operationId: addJournalAnnotation
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JournalAnnotationCommand'}
      responses:
        '201': {$ref: '#/components/responses/VersionedResource'}
  /notifications:
    get:
      tags: [Notifications and Jobs]
      operationId: listNotifications
      responses:
        '200':
          description: Durable web notification inbox
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
  /jobs:
    get:
      tags: [Notifications and Jobs]
      operationId: listJobs
      responses:
        '200':
          description: Durable job states
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Job'}}
  /jobs/{job_id}:
    get:
      tags: [Notifications and Jobs]
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job progress, attempts, checkpoints, and result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
  /jobs/{job_id}/{action}:
    post:
      tags: [Notifications and Jobs]
      operationId: controlJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [pause, resume, cancel, retry]}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': {$ref: '#/components/responses/VersionedResource'}
        '409': {$ref: '#/components/responses/Problem'}
  /audit-events:
    get:
      tags: [Audit and Health]
      operationId: listAuditEvents
      responses:
        '200':
          description: Authorized append-only audit history
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
  /health:
    get:
      tags: [Audit and Health]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process liveness without sensitive details
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {const: ok}}}
  /events:
    get:
      tags: [Notifications and Jobs]
      operationId: streamUserEvents
      responses:
        '200':
          description: Authenticated SSE stream for job progress and alerts; clients poll on loss
          content:
            text/event-stream:
              schema: {type: string}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tx_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    AccountId: {name: account_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    BreakerId: {name: breaker_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    IntegrationId: {name: integration_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    RunId: {name: run_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    StrategyId: {name: strategy_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    VersionId: {name: version_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    RecommendationId: {name: recommendation_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    PositionId: {name: position_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    EntryId: {name: entry_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    JobId: {name: job_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    SessionId: {name: session_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    UserId: {name: user_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    Category: {name: category, in: path, required: true, schema: {$ref: '#/components/schemas/MarketCategory'}}
  headers:
    ETag:
      description: Quoted aggregate version used with If-Match
      schema: {type: string}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Session:
      description: Authenticated session summary; token remains in HttpOnly cookie
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Session'}
    AcceptedJob:
      description: Durable asynchronous job accepted
      headers:
        Location: {schema: {type: string, format: uri-reference}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
    VersionedResource:
      description: Versioned command result
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
  schemas:
    Id: {type: string, format: uuid}
    Decimal:
      type: string
      pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
      description: Exact decimal serialized as a string
    Instant: {type: string, format: date-time}
    MarketCategory: {type: string, enum: [COMMODITY, FOREX, CRYPTO]}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    PasswordResetCompleteRequest:
      type: object
      required: [reset_token, new_password, proof]
      properties:
        reset_token: {type: string, writeOnly: true}
        new_password: {type: string, format: password, writeOnly: true, minLength: 12}
        proof:
          oneOf:
            - $ref: '#/components/schemas/MfaCodeRequest'
            - $ref: '#/components/schemas/MfaRecoveryCodeRequest'
    MfaRecoveryCodeRequest:
      type: object
      required: [recovery_code]
      properties:
        recovery_code: {type: string, writeOnly: true, minLength: 12}
    MfaResetCommand:
      type: object
      required: [reason, confirmation]
      properties:
        reason: {type: string, minLength: 8}
        confirmation: {type: string, enum: [CONFIRMED]}
    LoginResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [AUTHENTICATED, MFA_ENROLLMENT_REQUIRED, MFA_REQUIRED]}
        recovery_codes:
          type: array
          description: One-time recovery codes; returned only when TOTP enrollment completes.
          items: {type: string}
    BootstrapStatus:
      type: object
      required: [bootstrap_available]
      properties:
        bootstrap_available: {type: boolean}
    MfaCodeRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$'}
    MfaEnrollment:
      type: object
      required: [provisioning_uri]
      properties:
        provisioning_uri:
          type: string
          format: uri
          description: Sensitive one-time TOTP setup URI. Do not log or persist it in the browser.
    Session:
      type: object
      required: [id, user_id, assurance, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        user_id: {$ref: '#/components/schemas/Id'}
        assurance: {type: string, enum: [PASSWORD, MFA]}
        expires_at: {$ref: '#/components/schemas/Instant'}
        revoked_at: {$ref: '#/components/schemas/Instant'}
    Dashboard: {type: object, additionalProperties: true}
    Account:
      type: object
      required: [id, version, name, currency, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {type: integer, minimum: 1}
        name: {type: string}
        currency: {type: string, minLength: 3, maxLength: 3}
        status: {type: string}
    AccountCommand:
      type: object
      required: [name, currency, starting_balance]
      properties:
        name: {type: string}
        currency: {type: string, minLength: 3, maxLength: 3}
        starting_balance: {$ref: '#/components/schemas/Decimal'}
        broker_integration_id: {$ref: '#/components/schemas/Id'}
        provider_account_id:
          type: string
          description: A broker account returned by GET /integrations/{integration_id}/accounts; required when binding a broker source of risk truth.
    HighRiskCommand:
      type: object
      required: [reason, confirmation, payload]
      properties:
        reason: {type: string, minLength: 8}
        confirmation: {type: string, enum: [CONFIRMED]}
        payload: {type: object, additionalProperties: true}
    RiskSnapshot:
      type: object
      required: [state, capacity, quality, calculated_at, reason_codes]
      properties:
        state: {type: string, enum: [NORMAL, CAUTION, DEFENSIVE, LOCKDOWN]}
        capacity: {type: integer, minimum: 0, maximum: 2}
        quality: {type: string, enum: [VERIFIED, STALE, CONTRADICTORY, UNKNOWN]}
        calculated_at: {$ref: '#/components/schemas/Instant'}
        reason_codes: {type: array, items: {type: string}}
        event_guard_blocks:
          type: array
          items: {$ref: '#/components/schemas/EventGuardBlock'}
    EventRiskPolicyCommand:
      type: object
      required: [enabled_event_types, pre_event_buffer_seconds, post_event_buffer_seconds, reason, confirmation]
      additionalProperties: false
      properties:
        enabled_event_types: {type: array, minItems: 1, items: {type: string}, uniqueItems: true}
        pre_event_buffer_seconds: {type: integer, minimum: 0, maximum: 86400}
        post_event_buffer_seconds: {type: integer, minimum: 0, maximum: 86400}
        required_source_coverage: {type: array, items: {type: string}, uniqueItems: true}
        reason: {type: string, minLength: 8}
        confirmation: {type: string, const: CONFIRMED}
    EventRiskPolicy:
      allOf:
        - $ref: '#/components/schemas/EventRiskPolicyCommand'
        - type: object
          required: [id, version, effective_at]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            version: {type: integer}
            effective_at: {$ref: '#/components/schemas/Instant'}
    EconomicCalendarEvent:
      type: object
      required: [id, source_origin, official_url, title, event_type, importance, scheduled_at, coverage_state]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        source_origin: {type: string, enum: [OFFICIAL_MACHINE, OWNER_CITED]}
        official_url: {type: string, format: uri}
        title: {type: string}
        event_type: {type: string}
        importance: {type: string, enum: [HIGH, MEDIUM, LOW]}
        scheduled_at: {$ref: '#/components/schemas/Instant'}
        observed_at: {$ref: '#/components/schemas/Instant'}
        affected_currencies: {type: array, items: {type: string}}
        affected_categories: {type: array, items: {$ref: '#/components/schemas/MarketCategory'}}
        actual: {type: string, nullable: true}
        previous: {type: string, nullable: true}
        consensus: {type: string, nullable: true, description: Null means UNKNOWN; it is never inferred.}
        coverage_state: {type: string, enum: [VERIFIED, STALE, DEGRADED, CANCELLED]}
        source_retrieved_at: {$ref: '#/components/schemas/Instant'}
        supersedes_event_id: {$ref: '#/components/schemas/Id'}
    OwnerCitedEconomicEventCommand:
      type: object
      required: [official_url, title, event_type, importance, scheduled_at, reason]
      additionalProperties: false
      properties:
        official_url: {type: string, format: uri}
        title: {type: string, minLength: 1, maxLength: 256}
        event_type: {type: string, minLength: 1, maxLength: 128}
        importance: {type: string, enum: [HIGH, MEDIUM, LOW]}
        scheduled_at: {$ref: '#/components/schemas/Instant'}
        affected_currencies: {type: array, items: {type: string}}
        affected_categories: {type: array, items: {$ref: '#/components/schemas/MarketCategory'}}
        supersedes_event_id: {$ref: '#/components/schemas/Id'}
        reason: {type: string, minLength: 8, maxLength: 2000}
    EventGuardBlock:
      type: object
      required: [event_id, state, remaining_seconds, official_url]
      properties:
        event_id: {$ref: '#/components/schemas/Id'}
        state: {type: string, enum: [IN_GUARD_WINDOW, CALENDAR_COVERAGE_DEGRADED]}
        remaining_seconds: {type: integer, minimum: 0}
        official_url: {type: string, format: uri}
    CircuitBreaker:
      type: object
      required: [id, version, type, state]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {type: integer}
        type: {type: string}
        state: {type: string, enum: [ARMED, TRIPPED, ACKNOWLEDGED, CLEARED]}
    ProviderCatalogueEntry:
      type: object
      required: [provider, catalogue_revision, adapter_revision, category, lifecycle, capabilities]
      properties:
        provider: {type: string, enum: [MT5_TERMINAL_BRIDGE, COINBASE_EXCHANGE, TWELVE_DATA, FEDERAL_RESERVE, BLS, BEA, EIA, ECB, BOE, BOJ, CME_GROUP, LITELLM_PROXY]}
        catalogue_revision: {type: string}
        adapter_revision: {type: string}
        category: {type: string, enum: [BROKER_ACCOUNT_DATA, MARKET_DATA, ECONOMIC, LLM]}
        lifecycle: {type: string, enum: [APPROVED, DEPRECATED, RETIRED]}
        asset_categories: {type: array, items: {$ref: '#/components/schemas/MarketCategory'}}
        venues: {type: array, items: {type: string}}
        capabilities: {type: array, items: {type: string}}
        capability_semantics: {type: object, additionalProperties: {type: string, enum: [AUTHORITATIVE, ACTUAL, BROKER_PROXY, AGGREGATED_PROXY, UNAVAILABLE]}}
        permitted_models: {type: array, items: {type: string}}
        licensing_notice: {type: string}
        retention_posture: {type: string, enum: [NOT_APPLICABLE, STANDARD, ADMIN_VERIFIED]}
        credential_required: {type: boolean}
        entitlement_required: {type: boolean}
        credentials_are_write_only: {type: boolean, const: true}
        verification_only: {type: boolean}
    NonBrokerIntegrationCommand:
      type: object
      required: [provider, name, configuration, credentials, capabilities, reason]
      additionalProperties: false
      properties:
        provider: {type: string}
        name: {type: string, minLength: 1, maxLength: 128}
        configuration: {type: object, additionalProperties: true}
        credentials: {type: object, additionalProperties: true, writeOnly: true}
        capabilities: {type: array, items: {type: string}, uniqueItems: true}
        official_source: {type: boolean, default: true}
        licensing_accepted: {type: boolean}
        retention_accepted: {type: boolean}
        reason: {type: string, minLength: 8, maxLength: 2000}
    WriteOnlyCredentialCommand:
      type: object
      required: [credentials]
      additionalProperties: false
      properties:
        credentials: {type: object, additionalProperties: true, writeOnly: true}
    EntitlementDeclarationCommand:
      type: object
      additionalProperties: false
      required: [confirmation, evidence_reference, reason]
      properties:
        confirmation: {type: string, const: CONFIRM_ENTITLEMENT}
        evidence_reference: {type: string, minLength: 4, maxLength: 256, writeOnly: true}
        reason: {type: string, minLength: 8, maxLength: 2000}
    IntegrationLifecycleCommand:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: {type: string, enum: [ENABLE, DISABLE, RECONNECT]}
        reason: {type: string, minLength: 8, maxLength: 2000}
    Integration:
      type: object
      required: [id, version, category, provider, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {type: integer}
        category: {type: string, enum: [BROKER_ACCOUNT_DATA, MARKET_DATA, ECONOMIC, LLM, NOTIFICATION]}
        name: {type: string}
        mt5_account_login: {type: string, description: MT5 account login selected for this managed bridge.}
        mt5_server: {type: string, description: Broker server selected for this managed bridge.}
        provider: {type: string, description: Reviewed provider catalogue key.}
        catalogue_revision: {type: string}
        capabilities: {type: array, items: {type: string}}
        entitlement_status: {type: string, enum: [NOT_REQUIRED, UNVERIFIED, DECLARED, VERIFIED, MISSING, EXPIRED]}
        retention_posture: {type: string, enum: [NOT_APPLICABLE, STANDARD, ADMIN_VERIFIED]}
        status: {type: string, enum: [HEALTHY, DEGRADED, FAILED, DISABLED]}
        state: {type: string, enum: [HEALTHY, DEGRADED, FAILED, DISABLED]}
        credential_hint: {type: string, description: Masked value only}
        credential_status: {type: string, enum: [CONFIGURED, NOT_CONFIGURED]}
        credential: {type: string, const: WRITE_ONLY}
    ManagedMt5EnrollmentCommand:
      type: object
      required: [account_login, server]
      additionalProperties: false
      properties:
        account_login: {type: string, minLength: 1, maxLength: 256}
        server: {type: string, minLength: 1, maxLength: 256}
        display_name: {type: string, minLength: 1, maxLength: 128}
    ManagedMt5Enrollment:
      allOf:
        - $ref: '#/components/schemas/Integration'
        - type: object
          required: [enrollment]
          properties:
            enrollment:
              type: object
              required: [agent_id, code, expires_at]
              properties:
                agent_id: {$ref: '#/components/schemas/Id'}
                code: {type: string, writeOnly: true}
                expires_at: {$ref: '#/components/schemas/Instant'}
    RemovedManagedMt5Integration:
      type: object
      required: [integration_id, status, unbound_account_count]
      properties:
        integration_id: {$ref: '#/components/schemas/Id'}
        status: {const: REMOVED}
        unbound_account_count: {type: integer, minimum: 0}
    RemovedIntegration:
      type: object
      required: [integration_id, status]
      properties:
        integration_id: {$ref: '#/components/schemas/Id'}
        status: {const: REMOVED}
    ProviderAccountCandidate:
      type: object
      required: [provider_account_id, provider, verification_status]
      properties:
        provider_account_id: {type: string}
        provider: {const: MT5_TERMINAL_BRIDGE}
        display_name: {type: string}
        currency: {type: string, minLength: 3, maxLength: 3}
        account_mode: {type: string, enum: [PRACTICE, DEMO, LIVE, UNKNOWN]}
        verification_status: {type: string, enum: [DISCOVERED, VERIFIED, UNAVAILABLE]}
        verified_at: {$ref: '#/components/schemas/Instant'}
    Instrument:
      type: object
      required: [id, symbol, category, status, specification_quality]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        symbol: {type: string}
        category: {$ref: '#/components/schemas/MarketCategory'}
        status: {type: string, enum: [ACTIVE, INACTIVE, ARCHIVED]}
        specification_quality: {type: string, enum: [VERIFIED, INCOMPLETE, STALE]}
